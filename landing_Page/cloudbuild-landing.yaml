steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/axis-landing:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/axis-landing:latest'
      - '.'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/axis-landing'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'axis-landing'
      - '--image=gcr.io/$PROJECT_ID/axis-landing:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--port=8080'
      - '--project=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/axis-landing:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/axis-landing:latest'
